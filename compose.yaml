name: kopeika-front

services:
    front:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        image: kopeika-front:dev
        ports:
            - '${FRONT_PORT:-9000}:9000'
        env_file:
            - .env
        environment:
            CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-true}'
        volumes:
            - '.:/app'
            - front_node_modules:/app/node_modules
        networks:
            - kopeika

networks:
    kopeika:
        name: kopeika
        external: true

volumes:
    front_node_modules:
        driver: local
