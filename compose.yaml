name: kopeika-front

services:
    front:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        image: kopeika-front:dev
        ports:
            - '${FRONT_PORT:-9000}:9000'
        env_file:
            - .env
        environment:
            CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-true}'
        volumes:
            - '.:/app'
            - front_node_modules:/app/node_modules
        # Volume outlives image rebuilds; npm ci on start keeps workbox/etc. in sync with lockfile.
        command: ['sh', '-c', 'npm ci --ignore-scripts && npm run dev -- -H 0.0.0.0 -p 9000']
        networks:
            - kopeika

networks:
    kopeika:
        name: kopeika
        external: true

volumes:
    front_node_modules:
        driver: local
